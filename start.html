<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#EEF7FD">
<title>Live-Simulation · KMSZ</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  .stage { height: 100dvh; max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column;
    padding: clamp(18px, 2.4vh, 34px) clamp(24px, 3vw, 56px); }

  .head { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex: none; }
  .head .brand-logo { height: clamp(70px, 9vh, 128px); }
  .head .live { display: flex; align-items: center; gap: 10px; font-size: clamp(.72rem,1.1vw,.85rem); font-weight: 700;
    letter-spacing: .12em; text-transform: uppercase; color: var(--brand-700);
    background: var(--tint); padding: 9px 18px; border-radius: var(--r-pill); white-space: nowrap; }
  .live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--positive); animation: pulse 1.8s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(53,168,122,.5);} 70%{box-shadow:0 0 0 12px rgba(53,168,122,0);} 100%{box-shadow:0 0 0 0 rgba(53,168,122,0);} }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 2.4vh, 30px); min-height: 0; }
  .kicker { font-size: clamp(.76rem,1vw,.85rem); font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-600); }
  h1 { font-size: clamp(1.7rem, 3.6vw, 2.8rem); text-align: center; }

  .qr-frame { background: #fff; padding: clamp(12px,1.4vw,18px); border-radius: var(--r-lg); line-height: 0; border: 1px solid var(--line); box-shadow: var(--shadow-md); }
  .qr-frame img { width: clamp(220px, 32vh, 380px); height: clamp(220px, 32vh, 380px); display: block; border-radius: 8px; }
  .sid { font-size: clamp(.82rem,1.1vw,.98rem); color: var(--ink-soft); }
  .sid b { color: var(--brand-800); letter-spacing: .12em; font-variant-numeric: tabular-nums; }

  .counter { display: flex; align-items: baseline; gap: 14px; }
  .counter .n { font-size: clamp(2.8rem, 6vh, 4.6rem); font-weight: 800; line-height: 1; color: var(--brand-700); font-variant-numeric: tabular-nums; }
  .counter .l { font-size: clamp(1rem,1.4vw,1.25rem); color: var(--ink-soft); }

  .reveal { margin-top: clamp(4px,1vh,10px); }

  .foot { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 14px; padding-top: 6px; }
  .foot .brand-note { color: var(--ink-faint); font-size: clamp(.68rem,.9vw,.78rem); }
  .foot .ctrls { display: flex; gap: 10px; }
  .mini { appearance: none; cursor: pointer; font-family: inherit; font-weight: 600; font-size: clamp(.74rem,.95vw,.85rem);
    color: var(--brand-700); background: #fff; border: 1.5px solid var(--line); border-radius: var(--r-pill);
    padding: 8px 16px; display: inline-flex; align-items: center; gap: 7px; transition: background .2s, border-color .2s; }
  .mini:hover { background: var(--tint-2); border-color: var(--brand-400); }
</style>
</head>
<body>
<div class="bg-field"></div>

<div class="stage">
  <div class="head">
    <img src="logo-blue.png" class="brand-logo" alt="KMSZ – Knochenmarkspenderzentrale, Universitätsklinikum Düsseldorf">
    <div class="live"><span class="live-dot"></span> Live-Simulation</div>
  </div>

  <main>
    <div class="kicker">Jetzt mitmachen</div>
    <h1>QR-Code scannen und deinen HLA-Abgleich starten</h1>
    <div class="qr-frame"><img id="qrImg" alt="QR-Code zum Mitmachen"></div>
    <div class="sid">Session <b id="sessionId">–</b></div>
    <div class="counter">
      <span class="n mono" id="liveCount">0</span>
      <span class="l">Teilnehmende</span>
    </div>
    <div class="reveal">
      <button class="btn btn-primary" id="revealBtn">
        Ergebnisse anzeigen
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </main>

  <div class="foot">
    <span class="brand-note">Knochenmarkspenderzentrale · Universitätsklinikum Düsseldorf</span>
    <div class="ctrls">
      <button class="mini" id="fsBtn" title="Vollbild"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Vollbild</button>
      <button class="mini" id="newBtn" title="Neue Session"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8M20 12a8 8 0 0 1-13.7 5.6L4 16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 4v4h-4M4 20v-4h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Neue Session</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCaifpTXBg6gDxhp69FcxmyQc8vtu-Ui4o",
  authDomain: "kmsz-simulator.firebaseapp.com",
  projectId: "kmsz-simulator",
  storageBucket: "kmsz-simulator.firebasestorage.app",
  messagingSenderId: "193438905817",
  appId: "1:193438905817:web:b608c1af5caaa6922555c8"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const BASE = "https://tunakmz.github.io/kmsz-simulator/";
const $ = (id) => document.getElementById(id);
let unsub = null, currentId = null;

function newId() {
  return (Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 4)).toUpperCase();
}
/* Auto-session: fresh per talk (new tab), stable across accidental reloads */
function getSession(forceNew) {
  let id = forceNew ? null : sessionStorage.getItem("kmsz_session");
  if (!id) { id = newId(); sessionStorage.setItem("kmsz_session", id); }
  return id;
}

function start(forceNew) {
  const id = currentId = getSession(forceNew);
  const simLink = BASE + "index.html?session=" + id;
  $("sessionId").textContent = id;
  $("qrImg").src = "https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=0&color=145273&data=" + encodeURIComponent(simLink);
  $("liveCount").textContent = "0"; $("liveCount").dataset.v = "0";

  if (unsub) unsub();
  const q = query(collection(db, "results"), where("session", "==", id));
  unsub = onSnapshot(q, (snap) => animateStat($("liveCount"), snap.size), () => {});
}

function animateStat(el, to) {
  const from = parseInt(el.dataset.v || "0", 10);
  if (from === to) return;
  el.dataset.v = to;
  const s = performance.now(), dur = 500;
  (function step(now){ const t = Math.min(1,(now-s)/dur);
    el.textContent = Math.round(from+(to-from)*(1-Math.pow(1-t,3)));
    if (t<1) requestAnimationFrame(step);
  })(performance.now());
}

$("revealBtn").addEventListener("click", () => {
  location.href = "results.html?session=" + encodeURIComponent(currentId);
});
$("newBtn").addEventListener("click", () => {
  if (confirm("Neue Session starten? Die aktuelle Auswertung wird zurückgesetzt.")) start(true);
});
$("fsBtn").addEventListener("click", () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen?.();
  else document.exitFullscreen?.();
});

start(false);
</script>
</body>
</html>
